# dx4homelab fleet smartd policy (baked by dx4bluefin).
#
# All drives: monitor everything (-a), keep SMART on across power cycles
# (-o on -S on), never spin up a standby disk just to poll (-n standby,q),
# temperature alerts at 55 C warn / 65 C critical with 5 C change reports
# (-W 5,55,65 — laptop NVMe composite idles 35-45 C; the closet machines are
# the reason these thresholds exist), short self-test daily 02:xx and long
# self-test Saturdays 03:xx. Alerts go to ntfy via the exec handler; -m is
# required boilerplate for -M exec and is otherwise unused.
#
# NOTE: SMART cannot see PCIe link/controller dropouts (IG5236 class) — that
# is nvme-watch.service's job. This file covers media/wear/temperature.
DEVICESCAN -a -o on -S on -n standby,q -W 5,55,65 -s (S/../.././02|L/../../6/03) -m root -M exec /usr/libexec/smartd-ntfy.sh
